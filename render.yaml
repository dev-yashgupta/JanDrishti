# ============================================================
# JanDrishti AI — Render Blueprint (Infrastructure-as-Code)
# Deploys both FastAPI Backend and Next.js Frontend on Render
# ============================================================

services:
  # ── 1. FastAPI Backend Web Service ────────────────────────
  - type: web
    name: jandrishti-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false

  # ── 2. Next.js Frontend Web Service ───────────────────────
  - type: web
    name: jandrishti-frontend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: BACKEND_URL
        fromService:
          type: web
          name: jandrishti-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: NEXT_PUBLIC_USE_MOCK
        value: "false"
