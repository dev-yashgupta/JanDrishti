version: "3.9"

# JanDrishti AI - Docker Compose
#
# Database: Neon serverless PostgreSQL (cloud-hosted, no local DB container needed)
# Set DATABASE_URL in backend/.env before running:
#   DATABASE_URL=postgresql+psycopg://user:password@host/dbname?sslmode=require
#
# Usage:
#   docker compose up --build
#   docker compose exec backend python scripts/seed.py

services:
  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jandrishti_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    command: >
      sh -c "
        echo 'Running Alembic migrations...' &&
        alembic upgrade head &&
        echo 'Starting server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Next.js frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jandrishti_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_USE_MOCK: "false"
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
